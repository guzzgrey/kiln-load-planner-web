    window.__failNextCloudWrite = false;
    const result = (value) => Promise.resolve(value);
    window.supabase = { createClient: () => ({
      auth: { getSession: () => result({ data: { session: { user: { id: 'test-user' } } } }), signOut: () => result({}) },
      from: () => ({
        select: () => result({ data: [...window.__remoteState].map(([key, value]) => ({ key, value, updated_at: '2026-09-25T00:00:00.000Z' })), error: null }),

          rows.forEach((item) => window.__remoteState.set(item.key, item.value));
          return result({ error: null });
        },
        delete: () => ({ eq: (_field, key) => { window.__remoteState.delete(key); return result({ error: null }); } }),
      }),
      channel: () => ({ on() { return this; }, subscribe() { return this; } }),
    }) };
