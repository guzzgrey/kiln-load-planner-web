<!doctype html>
<html><body class="cloud-locked">
  <script>
    window.KILN_CLOUD_CONFIG = { url: 'test', publishableKey: 'test', table: 'state' };
    const westminsterKey = 'kiln-planner-order-v1:westminster-order';
    const savedPlans = JSON.stringify(Array.from({ length: 7 }, (_, index) => ({ loadNumber: index + 1 })));
    const cloudWestminster = { id: 'westminster-order', number: 'ORD-334605', calculated: true, plannedCycles: 7, viewCache: { plans: savedPlans, records: Array.from({ length: 7 }, (_, index) => ({ number: index + 1 })) } };
    const brokenWestminster = { id: 'westminster-order', number: 'ORD-334605', calculated: false, plannedCycles: 7 };
    window.__remoteState = new Map([['kiln-planner-completed-cycles-v1', []], ['kiln-planner-tag-sequence-v1', 10001], [westminsterKey, cloudWestminster]]);
    const protectedKey = 'kiln-planner-completed-cycles-v1';
    const protectedValue = [{ id: 'cycle-2', loadNumber: 2, boards: 640 }];
    localStorage.setItem(protectedKey, JSON.stringify(protectedValue));
    localStorage.setItem('kiln-planner-cloud-outbox-v1', JSON.stringify({ [protectedKey]: { type: 'set', value: protectedValue }, [westminsterKey]: { type: 'set', value: brokenWestminster } }));
    localStorage.setItem('kiln-planner-active-order-v1', JSON.stringify({ orderRef: 'westminster-order' }));
    localStorage.setItem(westminsterKey, JSON.stringify(brokenWestminster));
    localStorage.setItem('kiln-planner-tag-sequence-v1', '10009');
    window.__failNextCloudWrite = true;
    const result = (value) => Promise.resolve(value);
    window.supabase = { createClient: () => ({
      auth: { getSession: () => result({ data: { session: { user: { id: 'test-user' } } } }), signOut: () => result({}) },
      from: () => ({
        select: () => result({ data: [...window.__remoteState].map(([key, value]) => ({ key, value, updated_at: '2026-09-25T00:00:00.000Z' })), error: null }),
        upsert: (row) => {
          if (window.__failNextCloudWrite) { window.__failNextCloudWrite = false; return result({ error: { message: 'intentional test failure' } }); }
          const rows = Array.isArray(row) ? row : [row];
          rows.forEach((item) => window.__remoteState.set(item.key, item.value));
          return result({ error: null });
        },
        delete: () => ({ eq: (_field, key) => { window.__remoteState.delete(key); return result({ error: null }); } }),
      }),
      channel: () => ({ on() { return this; }, subscribe() { return this; } }),
    }) };
  </script>
  <script src="cloud-sync.js" data-app="cloud-sync-outbox-test-app.js"></script>
</body></html>
